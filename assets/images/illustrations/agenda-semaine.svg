<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="1280" height="760" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif"><title id="t">Semaine d’un professionnel avec l’agenda intelligent</title><desc id="d">Une semaine de cinq jours où chaque demi-journée est consacrée à un seul quartier : Neudorf le lundi et le mardi matin, Krutenau le mercredi, Robertsau le jeudi, Cronenbourg le vendredi. Les nettoyages récurrents sont signalés par un trait.</desc>
