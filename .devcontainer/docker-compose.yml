# Development only: the passwords below never leave the Codespace (ports are private by default).
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    # Shares the database's network, so PostGIS answers on localhost:5432.
    network_mode: service:db
    environment:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: qdeal
    depends_on:
      - db

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: qdeal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qdeal"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgis-data:
